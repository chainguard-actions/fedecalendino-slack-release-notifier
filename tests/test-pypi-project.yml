name: Test with PyPI project name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git context for release simulation
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/tags/v2.0.0
          GITHUB_ACTOR: test-user
        with:
          slack_webhook_url: "https://hooks.slack.com/services/FAKE/FAKE/FAKETOKEN"
          pypi_project_name: "my-pypi-package"
      - name: Assert action ran (fails gracefully with fake webhook, pypi path exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real webhook accepted)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake webhook URL (pypi path exercised)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
