name: Test custom button parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/tags/v2.5.0
          GITHUB_ACTOR: release-bot
        with:
          slack_webhook_url: "https://hooks.slack.com/services/FAKE/FAKE/FAKE"
          slack_button_text: "View Release"
          slack_button_url: "https://example.com/releases/v2.5.0"
          slack_button_emoji: ":rocket:"

      - name: Assert action ran with custom button params
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the webhook URL is fake (HTTP error from Slack)
          # but it should NOT crash due to the custom button parameters being invalid
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fake webhook, custom button params accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real webhook accepted the request)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
