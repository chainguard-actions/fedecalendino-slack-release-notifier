name: Test missing required webhook URL fails with assertion error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/tags/v1.0.0
          GITHUB_ACTOR: test-user
        with:
          # Provide an empty string to trigger the assertion failure in actions.py
          # PARAMS.slack_webhook_url assertion: assert slack_webhook_url, "SLACK_WEBHOOK_URL is not set"
          slack_webhook_url: ""

      - name: Assert action fails when webhook URL is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action MUST fail when slack_webhook_url is empty because
          # actions.py asserts: assert slack_webhook_url, "SLACK_WEBHOOK_URL is not set"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when slack_webhook_url is empty"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with an empty webhook URL"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
